stages:
  extract:
    cmd: python -m src.extract_to_json
    deps:
      - data/raw/egyptian_civil_code_bilingual.pdf
      - src/extract.py
    outs:
      - data/processed/articles.json

  ingest:
    cmd: python -m src.ingest_from_json
    deps:
      - data/processed/articles.json
      - src/chunk_embed.py
    params:
      - embedding_model
      - embedding_dim
    outs:
      - data/processed/ingest_receipt.json

  evaluate:
    cmd: python -m src.evaluate --run-name "dvc-repro" --top-k ${reranker_top_k}
    deps:
      - eval/golden_dataset.json
      - src/evaluate.py
      - src/retrieve.py
      - data/processed/ingest_receipt.json
    params:
      - embedding_model
      - reranker_model
      - reranker_top_k
    metrics:
      - eval/metrics.json:
          cache: false
