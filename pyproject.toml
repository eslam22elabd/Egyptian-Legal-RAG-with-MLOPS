[project]
name = "egyptian-legal-rag"
version = "0.1.0"
description = "Egyptian Legal RAG service (Qdrant Cloud + Gemini)"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.5.0",
    "qdrant-client>=1.12.0",
    "google-genai>=1.51.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.9",
    "mlflow>=2.19",
    "dvc[gdrive]>=3.55",
    "pyOpenSSL>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.16.5",
]

[tool.setuptools]
packages = ["src", "src.api"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
